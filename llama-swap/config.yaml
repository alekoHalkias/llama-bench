healthCheckTimeout: 300

macros:
  server: >-
    ${env.HOME}/Github/llama.cpp/build/bin/llama-server
    --port ${PORT} -ngl 99 -fa on --jinja --load-mode none --metrics

models:
  # unsloth/Qwen3.6-35B-A3B-MTP-GGUF keeps the multi-token prediction layers.
  # MTP doesn't support -np > 1 yet, so one slot (no --kv-unified needed).
  # The MTP layers and draft context need ~0.7 GB more VRAM, so 22 layers keep their experts on the CPU (2 more than without MTP).
  qwen3.6-mtp:
    cmd: >-
      ${server}
      -m ${env.HOME}/models/qwen3.6-35b-mtp/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --n-cpu-moe 22 -c 65536 -np 1
      -b 2048 -ub 2048
      --cache-type-k q8_0 --cache-type-v q8_0
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0
      --spec-type draft-mtp --spec-draft-n-max 3
    ttl: 1800

  gpt-oss-20b:
    cmd: >-
      ${server}
      -m ${env.HOME}/models/gpt-oss-20b/gpt-oss-20b-MXFP4.gguf
      --n-cpu-moe 6 -c 65536
    ttl: 1800

  # Coding-tuned MoE, same 3B-active layout as Qwen3.6. Plain attention, so its 128k KV
  # (~6.5 GB) is much bigger than Qwen3.6's and more experts go to the CPU.
  qwen3-coder-30b:
    cmd: >-
      ${server}
      -m ${env.HOME}/models/qwen3-coder-30b/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf
      --n-cpu-moe 26 -c 65536 -np 2 --kv-unified
      -b 2048 -ub 2048
      --cache-type-k q8_0 --cache-type-v q8_0
      --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0 --repeat-penalty 1.05
    ttl: 1800

  # Most literal skill-follower. Only 5 of 30 layers use global attention, so 64k KV is
  # ~0.8 GB; experts are ~0.48 GB/layer, so the freed VRAM moves 5 more layers to the GPU.
  gemma4-26b:
    cmd: >-
      ${server}
      -m ${env.HOME}/models/gemma4-26b/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      --n-cpu-moe 11 -c 65536 -np 2 --kv-unified
      -b 2048 -ub 2048
      --cache-type-k q8_0 --cache-type-v q8_0
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
      --reasoning-budget 0
      -n 8192
    ttl: 1800

  # Strata's own engine and Python server; llama-server can't read its packs. Same command as Strata's
  # run-coder-iq1_m.sh, without --open and on llama-swap's port. model-bench reads its /metrics/prometheus.
  # The Coder keeps 256 of the 512 experts per layer, chosen for code; its 29.6 GB shard is sized for 32 GB of RAM.
  strata-coder-iq1_m:
    cmd: >-
      sh -c "cd ${env.HOME}/Github/Strata && exec .venv/bin/python serve/server.py
      --engine strata --config strata-coder-iq1_m.json --port ${PORT}"
    ttl: 1800

profiles:
  qwen:
    description: "Qwen3.6 35B + MTP speculation"
    pins:
      local: qwen3.6-mtp
  gemma:
    description: "Gemma 4 26B"
    pins:
      local: gemma4-26b
  oss:
    description: "gpt-oss 20B"
    pins:
      local: gpt-oss-20b
  coder:
    description: "Qwen3-Coder 30B-A3B"
    pins:
      local: qwen3-coder-30b

hooks:
  on_startup:
    profile: qwen
